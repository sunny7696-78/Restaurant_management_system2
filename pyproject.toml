[project]
name = "intellipredict"
version = "0.1.0"
description = "AI-Powered Restaurant Demand Forecasting & Waste Optimization"
authors = [{ name = "Professional Google Engineer", email = "engineer@google.com" }]
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "plotly",
    "scikit-learn",
    "xgboost",
    "prophet",
    "tensorflow",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
